# superfile theme generated by matugen via DankMaterialShell
# Template: ~/.config/matugen/templates/superfile.toml
# Output:   ~/.config/superfile/theme/dms.toml

# Chroma style for file previews: https://github.com/alecthomas/chroma/tree/master/styles
code_syntax_highlight = "catppuccin-mocha"

#-- Full Screen
full_screen_fg = "{{colors.on_surface.default.hex}}"
full_screen_bg = "{{colors.surface.default.hex | lighten: 0.5}}"

#-- Gradient (two colors)
gradient_color = ["{{colors.primary.default.hex}}", "{{colors.tertiary.default.hex}}"]
directory_icon_color = ""

#-- File Panel
file_panel_fg = "{{colors.on_surface.default.hex}}"
file_panel_bg = "{{colors.surface.default.hex | lighten: 0.5}}"
file_panel_border = "{{colors.outline_variant.default.hex}}"
file_panel_border_active = "{{colors.primary.default.hex}}"
file_panel_top_directory_icon = "{{colors.tertiary.default.hex}}"
file_panel_top_path = "{{colors.primary.default.hex}}"
file_panel_item_selected_fg = "{{colors.primary.default.hex}}"
file_panel_item_selected_bg = "{{colors.surface.default.hex | lighten: 0.5}}"

#-- Footer
footer_fg = "{{colors.on_surface.default.hex}}"
footer_bg = "{{colors.surface.default.hex | lighten: 0.5}}"
footer_border = "{{colors.outline_variant.default.hex}}"
footer_border_active = "{{colors.tertiary.default.hex}}"

#-- Sidebar
sidebar_fg = "{{colors.on_surface_variant.default.hex}}"
sidebar_bg = "{{colors.surface.default.hex | lighten: 0.5}}"
sidebar_title = "{{colors.secondary.default.hex}}"
sidebar_border = "{{colors.surface.default.hex | lighten: 0.5}}"
sidebar_border_active = "{{colors.primary.default.hex}}"
sidebar_item_selected_fg = "{{colors.primary.default.hex}}"
sidebar_item_selected_bg = "{{colors.surface.default.hex | lighten: 0.5}}"
sidebar_divider = "{{colors.outline_variant.default.hex}}"

#-- Modals
modal_fg = "{{colors.on_surface.default.hex}}"
modal_bg = "{{colors.surface_container.default.hex}}"
modal_border_active = "{{colors.outline.default.hex}}"
modal_cancel_fg = "{{colors.on_error.default.hex}}"
modal_cancel_bg = "{{colors.error.default.hex}}"
modal_confirm_fg = "{{colors.on_primary.default.hex}}"
modal_confirm_bg = "{{colors.primary.default.hex}}"

#-- Help Menu
help_menu_hotkey = "{{colors.primary.default.hex}}"
help_menu_title = "{{colors.tertiary.default.hex}}"

#-- Special
cursor = "{{colors.primary.default.hex}}"
correct = "{{colors.tertiary.default.hex}}"
error = "{{colors.error.default.hex}}"
hint = "{{colors.secondary.default.hex}}"
cancel = "{{colors.error.default.hex}}"
